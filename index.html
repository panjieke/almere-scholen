<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Almere VO Schools Map</title>
<meta name="description" content="All secondary schools in Almere classified by level, concept and school board, with distance and travel time from any Almere postcode. In Dutch, English and Chinese.">
<meta property="og:title" content="Almere VO Schools Map">
<meta property="og:description" content="Secondary schools in Almere by level, concept and board, with travel times from your postcode. NL · EN · 中文">
<meta property="og:type" content="website">
<meta name="theme-color" content="#121A21">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121A21'/%3E%3Cpath d='M12 46h40M18 46V30h8v16M30 46V22h8v24M42 46V14h8v32' stroke='%23FD8D75' stroke-width='4' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: hero with postcode input → clickable level ladder + sortable grid with distance columns → clusters → special → concepts → boards → filterable, sortable directory. Trilingual NL / EN / 中文. Dark by default. */
:root{
  --bg:#121A21; --surface:#18232C; --raise:#1F2D38; --line:#2A3A47;
  --fg:#EDF1F4; --muted:#93A3B0; --coral:#FD8D75; --pink:#ED4CB7;
  --coral-soft:rgba(253,141,117,.14); --pink-soft:rgba(237,76,183,.14);
  --dot-off:#26343F; --ok:#6FD3A8; --bad:#FF8A8A;
  --f-display:"Outfit","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-body:"Outfit","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,"Noto Sans SC",monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F6F8; --surface:#FFFFFF; --raise:#EEF1F4; --line:#DCE2E7;
  --fg:#121A21; --muted:#5A6873; --coral:#D95E45; --pink:#C1308F;
  --coral-soft:rgba(217,94,69,.10); --pink-soft:rgba(193,48,143,.10);
  --dot-off:#E3E8EC; --ok:#1E8A5A; --bad:#C0392B; color-scheme:light;}

*{box-sizing:border-box}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;padding-inline:20px;padding-block:0 64px}
html[lang="zh"] body{line-height:1.7}
.wrap{max-width:1180px;margin:0 auto}
a{color:var(--coral);text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--coral)}
.muted{color:var(--muted)}

.topbar{display:flex;justify-content:flex-end;padding-top:20px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{font:500 13px var(--f-body);color:var(--muted);background:none;border:none;border-radius:999px;padding:6px 14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:linear-gradient(90deg,var(--coral),var(--pink));color:#121A21}

header.hero{padding-block:28px 36px;border-bottom:1px solid var(--line);display:grid;gap:28px}
.hero h1{font-size:clamp(34px,5.4vw,58px);font-weight:600;letter-spacing:-.02em;max-width:18ch}
html[lang="zh"] .hero h1{letter-spacing:0;max-width:16em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--coral),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:64ch;color:var(--muted);margin:0;font-size:17px}
.stats{display:flex;flex-wrap:wrap;gap:12px 40px}
.stat b{display:block;font-family:var(--f-display);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg)}
.stat span{font-size:13px;color:var(--muted)}

/* Postcode panel */
.pc{display:grid;gap:10px;padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:720px}
.pc label{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--coral)}
.pc-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pc input{font:600 20px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;width:11ch;max-width:100%}
.pc input:focus{border-color:var(--coral)}
.pc button{font:600 14px var(--f-body);color:#121A21;background:linear-gradient(90deg,var(--coral),var(--pink));border:none;border-radius:8px;padding:12px 18px;cursor:pointer}
.pc .status{font-size:14px;min-height:1.5em}
.pc .status.ok{color:var(--ok)}
.pc .status.bad{color:var(--bad)}
.pc .help{font-size:12.5px;color:var(--muted);margin:0}

section{padding-block:52px 0;display:grid;gap:22px}
.sec-head{display:grid;gap:8px;max-width:72ch}
.sec-head h2{font-size:clamp(24px,3vw,32px);font-weight:600}
.sec-head p{margin:0;color:var(--muted)}

/* Ladder */
.ladder{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font-size:12px}
.ladder button{font:inherit;padding:10px 8px;border-radius:6px;background:var(--raise);border:1px solid transparent;text-align:center;color:var(--muted);line-height:1.3;cursor:pointer}
.ladder button:hover{border-color:var(--coral)}
.ladder button b{display:block;color:var(--fg);font-weight:600;font-size:13px}
.ladder button[aria-pressed="true"]{background:var(--coral-soft);border-color:var(--coral);color:var(--fg)}
.ladder button[aria-pressed="true"] b{color:var(--coral)}
.ladder-axis{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.pick{font-size:14px;min-height:1.6em}
.pick b{color:var(--coral);font-weight:600}
.pick .clear{font:500 13px var(--f-body);color:var(--pink);background:none;border:none;cursor:pointer;padding:0;margin-left:8px;text-decoration:underline;text-underline-offset:3px}

/* Matrix */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:1060px;font-size:14px}
th,td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
thead th{background:var(--raise);padding:0;vertical-align:bottom}
thead th button{all:unset;box-sizing:border-box;display:flex;gap:4px;align-items:center;width:100%;padding:10px;cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
thead th.c button{justify-content:center;text-align:center}
thead th button:hover{color:var(--fg)}
thead th button:focus-visible{outline:2px solid var(--pink);outline-offset:-2px}
thead th[aria-sort="ascending"] button,thead th[aria-sort="descending"] button{color:var(--coral)}
.arr{font-size:10px;opacity:.45}
th[aria-sort="ascending"] .arr,th[aria-sort="descending"] .arr{opacity:1}
thead th.c,td.c{text-align:center}
th.trav{border-left:1px solid var(--line)}
td.trav{border-left:1px solid var(--line)}
td.name{font-weight:500}
td.name small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--dot-off)}
.dot.on{background:linear-gradient(135deg,var(--coral),var(--pink))}
.dot.part{background:transparent;border:2px solid var(--coral)}
td.note{color:var(--muted);font-size:13px;min-width:160px}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
td.num b{color:var(--fg);font-weight:600}
td.num small{display:block;color:var(--muted);font-size:11.5px;white-space:normal}
td.num .na{color:var(--muted)}
tr.dim td{opacity:.32}
th.hot,td.hot{background:var(--coral-soft)}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:8px;align-items:center}
.legend .src{flex-basis:100%;font-size:12px;display:block}

/* Clusters */
.clusters{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.cluster{padding:20px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;gap:10px;align-content:start;min-width:0}
.cluster .range{font-family:var(--f-mono);font-size:12px;color:var(--pink)}
.cluster h3{font-size:19px;font-weight:600}
.cluster p{margin:0;font-size:14px;color:var(--muted)}
.cluster ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.cluster li{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--raise)}

.rows{display:grid;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(160px,240px) 1fr;gap:6px 28px;padding-block:18px;border-bottom:1px solid var(--line)}
.row h3{font-size:17px;font-weight:600}
.row h3 small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);font-weight:400;margin-top:4px}
.row p{margin:0;color:var(--muted);font-size:15px;max-width:70ch}
.row p b{color:var(--fg);font-weight:500}

.boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.board{padding:18px 20px;border-radius:10px;background:var(--raise);display:grid;gap:8px;align-content:start}
.board h3{font-size:16px;font-weight:600}
.board p{margin:0;font-size:14px;color:var(--muted)}
.callout{font-size:13px;color:var(--muted);border-left:2px solid var(--pink);padding-left:12px;max-width:72ch;margin:0}

/* Directory */
.filters{display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 13px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip:hover{border-color:var(--coral)}
.chip[aria-pressed="true"]{background:var(--coral-soft);border-color:var(--coral);color:var(--coral)}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{font:400 15px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;width:100%;max-width:420px}
.sortsel{font:500 14px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
@media (max-width:420px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:grid;gap:12px;align-content:start;min-width:0}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.card h3{font-size:20px;font-weight:600}
.card .tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--pink)}
.card .motto{margin:0;color:var(--coral);font-size:14px;font-weight:500}
.lv{display:flex;flex-wrap:wrap;gap:5px}
.lv span{font-family:var(--f-mono);font-size:11.5px;padding:3px 8px;border-radius:4px;background:var(--raise);color:var(--fg)}
.lv span.sp{background:var(--pink-soft);color:var(--pink)}
.trip-card{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 12px;border-radius:8px;background:var(--raise);font-size:13px;color:var(--muted)}
.trip-card b{color:var(--fg);font-variant-numeric:tabular-nums}
.card p.desc{margin:0;font-size:14.5px;color:var(--muted)}
.card ul.hl{margin:0;padding-left:18px;font-size:14px;display:grid;gap:3px}
.card ul.hl li::marker{color:var(--coral)}
.contact{border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted);display:grid;gap:3px;overflow-wrap:anywhere}
.contact b{color:var(--fg);font-weight:500;margin-right:4px}
.empty{color:var(--muted);padding:24px 0}

footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:grid;gap:6px}
.terms{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 16px}
.terms summary{cursor:pointer;padding-block:12px;font-weight:600;color:var(--fg);font-size:14px}
.terms summary:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.terms ol{margin:0 0 14px;padding-left:20px;display:grid;gap:6px;max-width:80ch}
.terms li::marker{color:var(--coral)}
.terms p{margin:0 0 14px;font-size:12px}

@media (max-width:640px){
  .row{grid-template-columns:1fr}
  .ladder{grid-template-columns:repeat(4,minmax(0,1fr))}
  .ladder-axis{display:none}
}
@media (prefers-reduced-motion:no-preference){.chip,.ladder button,.lang button{transition:background .15s,border-color .15s,color .15s} tr td{transition:opacity .2s,background .2s}}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar">
  <div class="lang" role="group" aria-label="Taal / Language / 语言">
    <button type="button" id="lang-nl" data-l="nl" aria-pressed="false">NL</button>
    <button type="button" id="lang-en" data-l="en" aria-pressed="true">EN</button>
    <button type="button" id="lang-zh" data-l="zh" aria-pressed="false">中文</button>
  </div>
</div>

<header class="hero">
  <div class="eyebrow" data-t="heroEye"></div>
  <h1 data-t="h1"></h1>
  <p data-t="intro"></p>
  <div class="stats">
    <div class="stat"><b>18</b><span data-t="st1"></span></div>
    <div class="stat"><b>14</b><span data-t="st2"></span></div>
    <div class="stat"><b>4</b><span data-t="st3"></span></div>
    <div class="stat"><b>1</b><span data-t="st4"></span></div>
  </div>
  <form class="pc" id="pcForm" autocomplete="off">
    <label for="pc" data-t="pcLabel"></label>
    <div class="pc-row">
      <input id="pc" name="pc" inputmode="text" maxlength="7" spellcheck="false">
      <button type="submit" id="pcGo" data-t="pcBtn"></button>
    </div>
    <div class="status" id="pcStatus" aria-live="polite"></div>
    <p class="help" data-t="pcHelp"></p>
  </form>
</header>

<section id="levels">
  <div class="sec-head">
    <div class="eyebrow" data-t="lvEye"></div>
    <h2 data-t="lvH"></h2>
    <p data-t="lvP"></p>
  </div>
  <div class="ladder-axis"><span data-t="axR"></span><span data-t="axL"></span></div>
  <div class="ladder" id="ladder" role="group"></div>
  <div class="pick" id="pick" aria-live="polite"></div>
  <div class="scroll" role="region" aria-label="Levels per school" tabindex="0">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="matrix"></tbody>
    </table>
  </div>
  <div class="legend">
    <span><i class="dot on"></i><span data-t="lg1"></span></span>
    <span><i class="dot part"></i><span data-t="lg2"></span></span>
    <span><i class="dot"></i><span data-t="lg3"></span></span>
    <span class="src" data-t="sortHint"></span>
    <span class="src" id="tripNote"></span>
  </div>
</section>

<section id="clusters">
  <div class="sec-head">
    <div class="eyebrow" data-t="clEye"></div>
    <h2 data-t="clH"></h2>
    <p data-t="clP"></p>
  </div>
  <div class="clusters" id="clusterList"></div>
</section>

<section id="special">
  <div class="sec-head">
    <div class="eyebrow" data-t="spEye"></div>
    <h2 data-t="spH"></h2>
    <p data-t="spP"></p>
  </div>
  <div class="rows" id="specialList"></div>
</section>

<section id="concepts">
  <div class="sec-head">
    <div class="eyebrow" data-t="coEye"></div>
    <h2 data-t="coH"></h2>
    <p data-t="coP"></p>
  </div>
  <div class="rows" id="conceptList"></div>
</section>

<section id="boards">
  <div class="sec-head">
    <div class="eyebrow" data-t="boEye"></div>
    <h2 data-t="boH"></h2>
  </div>
  <div class="boards" id="boardList"></div>
  <p class="callout" data-t="boNote"></p>
</section>

<section id="directory">
  <div class="sec-head">
    <div class="eyebrow" data-t="dirEye"></div>
    <h2 data-t="dirH"></h2>
    <p data-t="dirP"></p>
  </div>
  <div class="filters">
    <div class="chips" id="chips" role="group"></div>
    <div class="frow">
      <input class="search" id="q" type="search">
      <select class="sortsel" id="dirSort"></select>
    </div>
    <div class="count" id="count"></div>
  </div>
  <div class="cards" id="cards"></div>
</section>

<footer>
  <div data-t="ft1"></div>
  <div data-t="ft2"></div>
  <div data-t="ft3"></div>
  <details class="terms" id="terms">
    <summary data-t="tcH"></summary>
    <div data-t="tcBody"></div>
  </details>
</footer>
</div>

 {h:{nl:"Het Baken · christelijk / interconfessioneel",en:"Het Baken · christelijk / interconfessioneel",zh:"Het Baken · 基督教 / 跨宗派"},p:{nl:"Park Lyceum, Poort Lyceum, Stad College, Trinitas Gymnasium",en:"Park Lyceum, Poort Lyceum, Stad College, Trinitas Gymnasium",zh:"Park Lyceum、Poort Lyceum、Stad College、Trinitas Gymnasium"}},

const ORDER=["Trinitas Gymnasium","Oostvaarders College","Waldorf Almere","Poort Lyceum","Park Lyceum","Helen Parkhurst","Montessori Campus 0-18","Arte College","De Meergronden","Echnaton","Stad College","Buitenhout College","Aeres VMBO Almere","Pro Almere"];
const DIR_ORDER=[...ORDER,"Taalcentrum Kopklas","Nautilus College","OPDC Almere","Aventurijn"];
const byName=n=>S.find(x=>x.n===n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- state ---------- */
let lang="en",level=null,cur="all",sortKey=null,sortDir=1,dirSort="default";
let origin=null; // {pc, ll, precise, home}
try{const s=localStorage.getItem("almere-lang");if(["nl","en","zh"].includes(s))lang=s}catch(e){}
if(["#nl","#en","#zh"].includes(location.hash))lang=location.hash.slice(1);

const $=id=>document.getElementById(id);
const mx=$("matrix"),ladder=$("ladder"),pick=$("pick"),chips=$("chips"),q=$("q"),cards=$("cards"),count=$("count"),thead=$("thead"),dirSel=$("dirSort");

/* ---------- geometry & travel model ---------- */
function hav(a,b){const R=6371,r=Math.PI/180;const dLa=(b[0]-a[0])*r,dLo=(b[1]-a[1])*r;const h=Math.sin(dLa/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
/* Calibrated on 15 Google Maps routes inside Almere: bike ≈ 1 + 3.9 min per straight km; walk ≈ 2 + 15.5 min/km; transit ≈ 13 + 3.4 min/km (rough). Route km ≈ straight × 1.3. */
function trip(s){
  if(!origin||!s.geo.length)return null;
  let best=null;
  s.geo.forEach((g,i)=>{const d=hav(origin.ll,GEO[g]);if(!best||d<best.d)best={d,i}});
  const d=best.d;
  const r={km:Math.round(d*1.3*10)/10,bike:Math.max(2,Math.round(1+3.87*d)),walk:Math.max(2,Math.round(2+15.5*d)),site:s.geoNames?s.geoNames[best.i]:null,si:best.i};
  const m=origin.home&&MEASURED[s.n];
  if(m){r.measured=true;if(m.bike)r.bike=m.bike;if(m.walkOnly){r.walkOnly=true;r.walk=m.walkOnly;r.ptSort=m.walkOnly}else{r.pt=m.tot;r.ptSort=m.tot;r.m=m}if(s.geoNames)r.site=s.geoNames[0]}
  else{const est=Math.round(13+3.4*d);if(r.walk<=est+3){r.walkOnly=true;r.ptSort=r.walk}else{r.pt=est;r.ptSort=est;r.est=true}}
  return r;
}
function gmaps(s,r){
  const dest=s.geoNames?s.a.split(" · ")[r.si||0].replace(/, Almere$/,"")+", Almere":s.a.replace(/ \(.*\)$/,"");
  return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(origin.pc+" Almere")}&destination=${encodeURIComponent(dest)}&travelmode=transit`;
}
function cellKm(r){const t=T[lang];return r?`<b>${r.km.toFixed(1)}</b> ${t.km}`:`<span class="na">—</span>`}
function cellBike(r){const t=T[lang];return r?`<b>${r.bike}</b> ${t.min}`+(r.site?`<small>${t.site1} ${r.site}</small>`:""):`<span class="na">—</span>`}
function cellPt(r,s){
  const t=T[lang];if(!r)return `<span class="na">—</span>`;
  if(r.walkOnly)return `<b>${r.walk}</b> ${t.min}<small>${t.walkOnly}</small>`;
  if(r.m){const m=r.m;return `<b>${m.tot}</b> ${t.min}<small>${m.train?t.ptTrain:t.pt} ${m.pt} + ${t.walk} ${m.walk}${m.wait?` + ${t.wait} ${m.wait}`:""} · ${m.line}</small>`}
  return `<b>≈ ${r.pt}</b> ${t.min}<small><a href="${gmaps(s,r)}" target="_blank" rel="noopener">${t.route} ↗</a></small>`;
}

/* ---------- postcode ---------- */
function normPc(v){return v.toUpperCase().replace(/\s+/g,"")}
async function sha(txt){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return ""}}
async function setPostcode(raw,save){
  const v=normPc(raw||"");const st=$("pcStatus");const t=T[lang];
  if(!v){origin=null;st.className="status";st.textContent=t.pcEmpty;renderTable();renderCards();return}
  const m=v.match(/^(\d{4})([A-Z])?([A-Z])?$/);
  let ll=null,precise=false;
  if(m){if(m[2]&&PC5[m[1]+m[2]]){ll=PC5[m[1]+m[2]];precise=true}else if(PC4[m[1]])ll=PC4[m[1]]}
  if(!ll){origin=null;st.className="status bad";st.textContent=t.pcBad;renderTable();renderCards();return}
  const pretty=m[1]+(m[2]?" "+m[2]+(m[3]||""):"");
  const home=(await sha(v))===HOME_HASH;
  origin={pc:pretty,ll,precise,home};
  if(save){try{localStorage.setItem("almere-pc",v)}catch(e){}}
  showPcStatus();
  if(sortKey===null&&save){sortKey="km";sortDir=1}
  renderTable();renderCards();
}
function showPcStatus(){
  const st=$("pcStatus"),t=T[lang];
  if(!origin){const v=normPc($("pc").value);st.className=v?"status bad":"status";st.textContent=v?t.pcBad:t.pcEmpty;return}
  st.className="status ok";st.textContent=origin.home?t.pcOkHome(origin.pc):t.pcOk(origin.pc,origin.precise?t.area5:t.area4);
}

/* ---------- table ---------- */
const HEAD=[{k:"name",lab:()=>T[lang].thSchool},...LADDER.map(x=>({k:x.k,lab:()=>x.th,c:true})),{k:"note",lab:()=>T[lang].thNotes},{k:"km",lab:()=>T[lang].thKm,trav:true},{k:"bike",lab:()=>T[lang].thBike},{k:"pt",lab:()=>T[lang].thPt}];
function renderHead(){
  thead.innerHTML=HEAD.map(h=>{const as=sortKey===h.k?(sortDir===1?"ascending":"descending"):"none";
    const arr=sortKey===h.k?(sortDir===1?"▲":"▼"):"↕";
    return `<th class="${h.c?"c":""}${h.trav?" trav":""}" aria-sort="${as}" data-k="${h.k}"><button type="button" id="sort-${h.k}">${h.lab()} <span class="arr" aria-hidden="true">${arr}</span></button></th>`}).join("");
}
function sortVal(n,k){
  const s=byName(n),L=s[lang];
  if(k==="name")return n.toLowerCase();
  if(k==="note")return L.note.toLowerCase();
  if(COLS.includes(k)){const v=s.L[k];return v===1?0:v===2?1:2}
  const r=trip(s);if(!r)return Infinity;
  if(k==="km")return r.km;if(k==="bike")return r.bike;if(k==="pt")return r.ptSort;
}
function sortedRows(){
  const rows=[...ORDER];if(!sortKey)return rows;
  const idx=n=>ORDER.indexOf(n);
  return rows.sort((a,b)=>{const va=sortVal(a,sortKey),vb=sortVal(b,sortKey);
    if(va===vb)return idx(a)-idx(b);
    if(va===Infinity)return 1;if(vb===Infinity)return -1;
    return (typeof va==="string"?va.localeCompare(vb):va-vb)*sortDir});
}
function renderTable(){
  renderHead();
  mx.innerHTML=sortedRows().map(n=>{const s=byName(n),L=s[lang],r=trip(s);
    return `<tr data-name="${esc(n)}"><td class="name">${esc(n)}<small>${esc(L.t)}</small></td>`+
      COLS.map(c=>{const v=s.L[c];return `<td class="c"><i class="dot${v===1?" on":v===2?" part":""}"></i></td>`}).join("")+
      `<td class="note">${esc(L.note)}</td><td class="num trav">${cellKm(r)}</td><td class="num">${cellBike(r)}</td><td class="num">${cellPt(r,s)}</td></tr>`}).join("");
  $("tripNote").innerHTML=origin?(origin.home?T[lang].noteHome:T[lang].noteEst):"";
  applyLevel();
}
thead.addEventListener("click",e=>{const th=e.target.closest("th");if(!th)return;const k=th.dataset.k;
  if(sortKey===k){if(sortDir===1)sortDir=-1;else{sortKey=null;sortDir=1}}else{sortKey=k;sortDir=1}
  renderTable();const b=$("sort-"+k);if(b)b.focus()});

/* ---------- ladder ---------- */
function applyLevel(){
  const t=T[lang];
  [...ladder.children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===level));
  const ci=level?COLS.indexOf(level)+1:-1;
  thead.querySelectorAll("th").forEach((th,i)=>th.classList.toggle("hot",i===ci));
  [...mx.rows].forEach(tr=>{const s=byName(tr.dataset.name);
    tr.classList.toggle("dim",!!level&&!s.L[level]);
    [...tr.cells].forEach((td,i)=>td.classList.toggle("hot",i===ci))});
  if(level){
    const yes=sortedRows().filter(n=>byName(n).L[level]);
    const cav=yes.filter(n=>byName(n).L[level]===2);
    const sep=lang==="zh"?"、":", ";
    const lab=LADDER.find(x=>x.k===level).full[lang];
    pick.innerHTML=t.pickRes(yes.length,lab,yes.join(sep))+(cav.length?` <span class="muted">${t.pickCav(cav.join(sep))}</span>`:"")+`<button type="button" class="clear" id="lad-clear">${t.clear}</button>`;
  } else pick.innerHTML=`<span class="muted">${t.pickHint}</span>`;
}
function setLevel(k){level=COLS.includes(k)?k:null;cur=level||"all";
  [...chips.children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.k===cur));applyLevel();renderCards()}
ladder.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;setLevel(b.dataset.k===level?null:b.dataset.k)});
pick.addEventListener("click",e=>{if(e.target.id==="lad-clear")setLevel(null)});

/* ---------- directory ---------- */
function renderCards(){
  const t=T[lang],term=q.value.trim().toLowerCase();
  let list=S.filter(s=>{
    const ok=cur==="all"||(cur==="sp"?s.sp:!!s.L[cur]);if(!ok)return false;if(!term)return true;
    const txt=[s.n,s.m,s.k,s.a,...(s.lv||[]),...["nl","en","zh"].flatMap(l=>[s[l].t,s[l].d,s[l].note,...s[l].h,...(s[l].lv||[])])].join(" ").toLowerCase();
    return txt.includes(term)});
  const di=n=>DIR_ORDER.indexOf(n);
  const num=(s,f)=>{const r=trip(s);return r?f(r):Infinity};
  if(dirSort==="az")list.sort((a,b)=>a.n.localeCompare(b.n));
  else if(dirSort==="km")list.sort((a,b)=>num(a,r=>r.km)-num(b,r=>r.km)||di(a.n)-di(b.n));
  else if(dirSort==="bike")list.sort((a,b)=>num(a,r=>r.bike)-num(b,r=>r.bike)||di(a.n)-di(b.n));
  else if(dirSort==="pt")list.sort((a,b)=>num(a,r=>r.ptSort)-num(b,r=>r.ptSort)||di(a.n)-di(b.n));
  else list.sort((a,b)=>di(a.n)-di(b.n));
  count.textContent=t.count(list.length,S.length);
  cards.innerHTML=list.length?list.map(s=>{const L=s[lang],lv=L.lv||s.lv,r=trip(s);
    const tripBox=origin?(r?`<div class="trip-card"><span>${t.fromHome}</span><span>${cellKm(r)}</span><span>${t.bike} ${cellBike(r).replace(/<small>.*<\/small>/,"")}</span><span>${t.pt} ${cellPt(r,s).replace(/<small>/," <span class='muted'>").replace(/<\/small>/,"</span>")}</span></div>`:`<div class="trip-card"><span>${t.fromHome}</span><span>${t.multi}</span></div>`):"";
    return `
   <article class="card">
     <div class="top"><h3>${esc(s.n)}</h3><span class="tag">${esc(L.t)}</span></div>
     <p class="motto">${esc(s.m)}</p>
     <div class="lv">${lv.map(l=>`<span class="${s.sp?"sp":""}">${esc(l)}</span>`).join("")}</div>
     ${tripBox}
     <p class="desc">${esc(L.d)}</p>
     <ul class="hl">${L.h.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
     <div class="contact">
       <div><b>${t.addr}</b>${esc(s.a)}</div>
       <div><b>${t.phone}</b>${esc(s.p)}</div>
       <div><b>${t.email}</b>${esc(s.e)}</div>
       <div><b>${t.board}</b>${esc(s.b)}${s.b!=="—"?t.inferred:""}</div>
       <div><a href="${s.w}" target="_blank" rel="noopener">${t.site}</a></div>
     </div>
   </article>`}).join(""):`<p class="empty">${t.empty}</p>`;
}
chips.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  cur=b.dataset.k;level=COLS.includes(cur)?cur:null;
  [...chips.children].forEach(c=>c.setAttribute("aria-pressed",c===b));applyLevel();renderCards()});
q.addEventListener("input",renderCards);
dirSel.addEventListener("change",()=>{dirSort=dirSel.value;renderCards()});

/* ---------- static / language ---------- */
function renderStatic(){
  const t=T[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{el.innerHTML=t[el.dataset.t]});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  ladder.setAttribute("aria-label",t.ladderLabel);chips.setAttribute("aria-label",t.chipsLabel);
  q.placeholder=t.search;q.setAttribute("aria-label",t.search);
  $("pc").placeholder=t.pcPh;
  ladder.innerHTML=LADDER.map(x=>`<button type="button" id="lad-${x.k}" data-k="${x.k}" aria-pressed="${x.k===level}"><b>${x.b}</b>${x[lang]}</button>`).join("");
  $("clusterList").innerHTML=CLUSTERS.map(c=>`<div class="cluster"><div class="range">${c.r[lang]}</div><h3>${c.h[lang]}</h3><p>${c.p[lang]}</p><ul>${c.s.map(n=>`<li>${n}</li>`).join("")}</ul></div>`).join("");
  $("specialList").innerHTML=SPECIAL.map(r=>`<div class="row"><h3>${r.h}<small>${r.s[lang]}</small></h3><p>${r.p[lang]}</p></div>`).join("");
  $("conceptList").innerHTML=CONCEPTS.map(r=>`<div class="row"><h3>${r.h[lang]}<small>${r.s}</small></h3><p>${r.p[lang]}</p></div>`).join("");
  $("boardList").innerHTML=BOARDS.map(b=>`<div class="board"><h3>${b.h[lang]}</h3><p>${b.p[lang]}</p></div>`).join("");
  const F=[["all",t.all],["g","gymnasium"],["v","vwo"],["h","havo"],["gt","vmbo-g/t · mavo"],["k","vmbo-k"],["b","vmbo-b"],["pro","PrO"],["sp",t.special]];
  chips.innerHTML=F.map(([k,l])=>`<button type="button" class="chip" id="f-${k}" data-k="${k}" aria-pressed="${k===cur}">${l}</button>`).join("");
  dirSel.setAttribute("aria-label",t.sortBy);
  dirSel.innerHTML=[["default",t.sDefault],["az",t.sAz],["km",t.sKm],["bike",t.sBike],["pt",t.sPt]].map(([v,l])=>`<option value="${v}"${v===dirSort?" selected":""}>${t.sortBy}: ${l}</option>`).join("");
  showPcStatus();
  renderTable();renderCards();
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{
  lang=b.dataset.l;try{localStorage.setItem("almere-lang",lang)}catch(e){}renderStatic()}));

$("pcForm").addEventListener("submit",e=>{e.preventDefault();setPostcode($("pc").value,true)});
$("pc").addEventListener("input",()=>{const v=normPc($("pc").value);if(/^\d{4}[A-Z]{2}$/.test(v))setPostcode(v,true);else if(!v)setPostcode("",false)});

renderStatic();
(function(){let saved="";try{saved=localStorage.getItem("almere-pc")||""}catch(e){}
  if(saved){$("pc").value=saved.replace(/^(\d{4})([A-Z]{2})$/,"$1 $2");setPostcode(saved,false).then(()=>{if(sortKey===null){sortKey="km";sortDir=1;renderTable()}})}})();
</script>
